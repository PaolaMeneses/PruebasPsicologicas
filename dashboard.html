<body>

    // ==========================================

    // ==========================================
    function FormCompromiso({ savedData, onSave, onBack }) {
      const [acepta, setAcepta] = useState(savedData.acepta || false);

      return (
        <div className="max-w-4xl mx-auto my-8 p-6 bg-white rounded-xl shadow-md">

            <h2 className="text-2xl font-bold text-itm-blue">Acta de Compromiso de Responsabilidades</h2>
            <button onClick={onBack} className="text-sm font-semibold text-red-500 hover:underline">Volver al Dashboard</button>
          </div>
          <div className="bg-gray-50 p-4 rounded-lg text-sm text-gray-700 border mb-6 space-y-3 text-justify">

            <p><strong>3.</strong> Asistir con puntualidad y alta responsabilidad corporativa a las entrevistas de selección pactadas con las organizaciones.</p>
            <p><strong>4.</strong> Mantener la condición de matrícula activa durante toda la vigencia del contrato de aprendizaje o convenio.</p>

              onSave({ acepta: e.target.checked }, false);
            }} />
            <span className="text-sm font-bold text-itm-blue">Acepto voluntariamente y firmo en señal de total compromiso legal las responsabilidades consagradas.</span>
          </label>
          <div className="mt-8 pt-4 border-t flex justify-end">
            <button onClick={() => onSave({ acepta: acepta }, true)} disabled={!acepta} className={`px-6 py-3 font-bold rounded-lg text-white ${acepta ? 'bg-teal-700 hover:bg-teal-800' : 'bg-gray-400 cursor-not-allowed'}`}>
              Formalizar Suscripción Digital del Acta
            </button>
          </div>
        </div>
      );
    }
// ==========================================
    // CONTROLADOR PRINCIPAL ACTUALIZADO (APP)
    // ==========================================
    function App() {
      const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('unif_user')) || null);
      const [screen, setScreen] = useState('welcome');
      const [status, setStatus] = useState({
        nieCompleted: false, desCompleted: false, hvCompleted: false, compromisoCompleted: false
      });

      // Cargar estado de progreso del estudiante actual
      useEffect(() => {
        if (user) {
          const keyStatus = `itm_status_${user.cc}`;
          const savedStatus = JSON.parse(localStorage.getItem(keyStatus));
          if (savedStatus) {
            setStatus(savedStatus);
          }
          setScreen('lobby');
        } else {
          setScreen('welcome');
        }
      }, [user]);

      const handleStart = (userData) => {
        localStorage.setItem('unif_user', JSON.stringify(userData));
        setUser(userData);
      };
       
      const handleLogout = () => {
        if(window.confirm("¿Estás seguro de que deseas salir?")) {
          // Limpiar la sesión activa del usuario
          localStorage.removeItem('unif_user');
          setUser(null);
          
          // Forzar la recarga limpia de la página para pintar el formulario de ingreso
          window.location.href = 'dashboard.html';
        }
      };
      

      // Función que gestiona la navegación externa hacia las páginas correspondientes
      const handleNavigation = (targetModule) => {
        // Creamos los parámetros de la URL para compartirlos con los otros archivos .html
        const params = new URLSearchParams({
          cc: user.cc,
          nombre: user.nombre,
          email: user.email,
          fromDashboard: 'true'
        }).toString();

        if (targetModule === 'nie') {
          // Si en tu "index.html" manejas múltiples vistas, le pasamos que inicie en el test_nie
          window.location.href = `index.html?${params}&initTest=nie`;
        } 
        else if (targetModule === 'destrezas') {
          window.location.href = `index.html?${params}&initTest=destrezas`;
        } 
        else if (targetModule === 'hv') {
          window.location.href = `hv.html?${params}&revisar=true`;
        } 
        else if (targetModule === 'compromiso') {
          window.location.href = `compromiso.html?${params}&revisar=true`;
        }
      };

      return (
        <div>
          {screen === 'welcome' && <WelcomeScreen onStart={handleStart} />}
          
          {screen === 'lobby' && (
            <DashboardLobby 
              user={user} 
              status={status} 
              onSelectModule={handleNavigation} 
              onLogout={handleLogout} 
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
