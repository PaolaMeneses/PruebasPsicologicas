      const [currentSectionIdx, setCurrentSectionIdx] = useState(() => {
        return parseInt(localStorage.getItem('itm_nie_idx')) || 0;
      });

        const saved = localStorage.getItem('itm_nie_answers');
        return saved ? JSON.parse(saved) : {};
      });
      
      useEffect(() => { localStorage.setItem('itm_nie_idx', currentSectionIdx.toString()); }, [currentSectionIdx]);
      useEffect(() => { localStorage.setItem('itm_nie_answers', JSON.stringify(answers)); }, [answers]);

      const section = N_I_E_DATA[currentSectionIdx];
      const handleAnswer = (questionId, value) => setAnswers(prev => ({ ...prev, [questionId]: value }));
      const allAnswered = section.questions.every(q => answers[q.id] !== undefined);
      
      const handleNext = () => { 
        if (currentSectionIdx < N_I_E_DATA.length - 1) {
          setCurrentSectionIdx(currentSectionIdx + 1); 
          window.scrollTo(0,0);
        } else { 
          onFinish(answers); 
          window.scrollTo(0,0);
        }

            </div>
          </div>

            else if (totalScore >= 21 && totalScore <= 28) { interpretation = "Vulnerable"; color = "text-orange-700 bg-orange-50 border-orange-200"; }

            else if (totalScore >= 18 && totalScore <= 22) { interpretation = "Vulnerable"; color = "text-orange-700 bg-orange-50 border-orange-200"; }
            else if (totalScore >= 0 && totalScore <= 17) { interpretation = "Zona de Cautela"; color = "text-red-700 bg-red-50 border-red-200"; }

          else if (id === "CE15") {

            else if (totalScore >= 29 && totalScore <= 33) { interpretation = "Hábil"; color = "text-blue-700 bg-blue-50 border-blue-200"; }

          }

            else if (totalScore >= 9 && totalScore <= 18) { interpretation = "Hábil"; color = "text-blue-700 bg-blue-50 border-blue-200"; }
            else if (totalScore >= 19 && totalScore <= 31) { interpretation = "Vulnerable"; color = "text-orange-700 bg-orange-50 border-orange-200"; }
            else if (totalScore >= 32 && totalScore <= 96) { interpretation = "Zona de Cautela"; color = "text-red-700 bg-red-50 border-red-200"; }
          }

        });
        setCalculatedResults(processed);
        setScreen('results_nie');
        window.scrollTo(0,0);
      };

      const handleSendDataNIE = () => {
        setIsSubmitting(true);
        const payload = { nombre: user.nombre, cc: String(user.cc), email: user.email };
        calculatedResults.forEach(res => {
          const prefijo = res.id.toLowerCase(); 
          payload[`${prefijo}_puntaje`] = res.score;
          payload[`${prefijo}_interpretacion`] = res.interpretation;
        });

        const FLOW_URL = "https://default069ff609ffcd494196eaf58efbb15a.37.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/22e801a91838478dab384f725c83d4a0/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=6SnriYoixgcQ5aqHFNUPPI2id8MwbOf_BzkcNxNQtxU";

        fetch(FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(response => {
          setIsSubmitting(false);
          if (response.ok) { 
            setSubmitSuccess(true); 
            setNieCompleted(true); 
            localStorage.removeItem('itm_nie_idx');
            localStorage.removeItem('itm_nie_answers');
            window.scrollTo(0,0); 
          } else { alert("Error al enviar los datos."); }
        }).catch(error => { setIsSubmitting(false); console.error("Error:", error); });
      };

      // --- CALCULADORA DESTREZAS ---
      const processResultsDestrezas = (rawAnswers) => {
        const processed = DESTREZAS_DATA.map(section => {
          let scorePersonal = 0;
          let scoreCargo = 0;
          section.questions.forEach(q => { 
            scorePersonal += (rawAnswers[`${q.id}_personal`] || 0); 
            scoreCargo += (rawAnswers[`${q.id}_cargo`] || 0); 
          });
          return { id: section.id, title: section.title, personal: scorePersonal, cargo: scoreCargo, brecha: scoreCargo - scorePersonal };
        });
        setCalculatedDestrezas(processed);
        setScreen('results_destrezas');
        window.scrollTo(0,0);
      };

      const handleSendDataDestrezas = () => {
        setIsSubmitting(true);
        const payload = { nombre: user.nombre, cc: String(user.cc), email: user.email };
        calculatedDestrezas.forEach(res => {
          const prefijo = res.id.toLowerCase();
          payload[`${prefijo}_personal`] = res.personal;
          payload[`${prefijo}_cargo`] = res.cargo;
        });

        const FLOW_URL_DESTREZAS = "https://default069ff609ffcd494196eaf58efbb15a.37.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c4f7257251d3442d94f22f88e47d429d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=h5qKaM596QWG4oLiDffdGhJLWASAIlYRGrWfBqV4Pp0";

        fetch(FLOW_URL_DESTREZAS, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(response => {
          setIsSubmitting(false);
          if (response.ok) { 
            setSubmitSuccess(true); 
            setDestrezasCompleted(true); 
            localStorage.removeItem('itm_des_idx');
            localStorage.removeItem('itm_des_answers');
            window.scrollTo(0,0); 
          } 
          else { alert("Error del servidor: Power Automate rechazó los datos."); }
        }).catch(error => { 
          setIsSubmitting(false); 
          console.error("Error detallado:", error);
          alert("No se pudo enviar. Verifica la conexión a internet o la URL."); 
        });
      };

      return (
        <div>
          {screen === 'welcome' && <WelcomeScreen onStart={userData => { setUser(userData); setScreen('lobby'); window.scrollTo(0,0); }} />}
          
          {screen === 'lobby' && (
            <LobbyScreen user={user} nieCompleted={nieCompleted} destrezasCompleted={destrezasCompleted} onLogout={handleLogout} onSelectTest={(testName) => { setSubmitSuccess(false); setScreen(testName === 'nie' ? 'test_nie' : 'test_destrezas'); window.scrollTo(0,0); }} />
          )}

          {screen === 'test_nie' && <TestScreen onFinish={processResultsNIE} onBackLobby={() => setScreen('lobby')} />}
          
          {screen === 'results_nie' && (
            <div className="flex-1 w-full flex flex-col bg-itm-light min-h-screen pb-12">
              <div className="bg-itm-blue w-full px-6 py-5 shadow-md sticky top-0 z-50">

                  )}

              </div>

                {submitSuccess ? (
                  <div className="glass-card max-w-2xl mx-auto p-12 text-center mt-10">
                    <span className="inline-flex items-center justify-center w-20 h-20 bg-green-100 text-green-600 rounded-full mb-6">
                      <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                    </span>
                    <h2 className="text-3xl font-extrabold text-itm-blue mb-3">¡Reporte Enviado!</h2>
                    <p className="text-gray-600 text-lg mb-8">Tu evaluación N.I.E. ha sido registrada exitosamente.</p>
                    <button onClick={() => { setSubmitSuccess(false); setScreen('lobby'); window.scrollTo(0,0); }} className="btn-primary px-8 py-3 font-bold">
                      Volver al Menú Principal
                    </button>
                  </div>
                ) : (
                  <>
                    <div className="bg-white rounded-xl shadow-sm p-6 mb-8 border border-gray-100 flex items-center gap-4">
                      <div className="w-12 h-12 bg-blue-50 text-itm-blue rounded-full flex items-center justify-center text-xl">🎓</div>
                      <div>
                        <h2 className="text-xl font-bold text-itm-blue">{user.nombre}</h2>

                      </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                      {calculatedResults.map(res => (
                        <div key={res.id} className="bg-white rounded-xl shadow-sm p-5 border-t-4 flex flex-col justify-between h-full" style={{ borderTopColor: res.colorClass.includes('emerald') ? '#10b981' : res.colorClass.includes('orange') ? '#f97316' : res.colorClass.includes('red') ? '#ef4444' : '#3b82f6' }}>

                      {isSubmitting ? 'Enviando...' : 'ENVIAR REPORTE A OFICINA'}
                    </button>
                  )}
                </div>
              </div>

              <div className="max-w-7xl mx-auto w-full p-4 md:p-8">
                {submitSuccess ? (
                  <div className="glass-card max-w-2xl mx-auto p-12 text-center mt-10">

                      <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                    </span>

                    <p className="text-gray-600 text-lg mb-8">Tu evaluación de Destrezas ha sido registrada exitosamente.</p>
                    <button onClick={() => { setSubmitSuccess(false); setScreen('lobby'); window.scrollTo(0,0); }} className="btn-primary px-8 py-3 font-bold">Volver al Menú Principal</button>
                  </div>
                ) : (
                  <>
                    <div className="bg-white rounded-xl shadow-sm p-6 mb-8 border border-gray-100 flex items-center gap-4">
                      <div className="w-12 h-12 bg-orange-50 text-itm-accent rounded-full flex items-center justify-center text-xl">🚀</div>
                      <div>
                        <h2 className="text-xl font-bold text-itm-blue">{user.nombre}</h2>

                      </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {calculatedDestrezas.map(res => (
                        <div key={res.id} className="bg-white rounded-xl shadow-sm p-5 border-l-4 border-itm-accent flex flex-col justify-between">
                          <h3 className="font-bold text-gray-800 text-sm mb-4 h-10">{res.title}</h3>
                          <div className="grid grid-cols-2 gap-4">
                            <div className="bg-blue-50 p-3 rounded text-center">
                              <p className="text-xs text-blue-600 font-bold uppercase mb-1">Personal</p>
                              <p className="text-2xl font-extrabold text-itm-blue">{res.personal}</p>
                            </div>
                            <div className="bg-orange-50 p-3 rounded text-center">
                              <p className="text-xs text-orange-600 font-bold uppercase mb-1">Cargo</p>
                              <p className="text-2xl font-extrabold text-itm-accent">{res.cargo}</p>
                            </div>
                          </div>
                          {res.brecha > 0 && (
                            <p className="text-xs text-red-500 font-bold mt-4 text-center">Brecha: El cargo exige {res.brecha} puntos más de los que posees.</p>
                          )}

                      ))}
                    </div>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
